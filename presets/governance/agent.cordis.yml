# The `governance` agent preset for the software-project-governance workflow —
# shipped IN PACKAGE form (mounted in place by the bundle's `agent-presets`
# roots declaration in cordis.patch.yml).
#
# Same-source note (drift risk): this file is derived from
# `adapters/dsh/agent.cordis.yml.template` — the same composition
# `adapters/dsh/launch.py --install` writes to
# `${DSH_HOME}/.agent-presets/governance/` with ABSOLUTE substituted paths.
# The only intended differences: (a) skill roots are RELATIVE so the preset
# mounts in place inside the installed package, (b) the persona derives the
# plugin root from the skill resourceBase instead of a substituted absolute
# path. Keep this file and the template in sync on every persona/contract
# change. Version sync is currently MANUAL three-way (SKILL.md frontmatter
# version = this file's persona version line = package.json version; verified
# aligned at 0.76.0 in the FEAT-010 round). A machine anchor guard for this
# file is registered as FIX-272 (a verify_workflow.py
# INJECTION_CONTRACT_ANCHORS key to be added for this path); until that guard
# lands, every release MUST re-verify the version line by hand.
#
# Relative-path semantics: a preset row's relative paths resolve from THIS
# file's own directory (dsh-agent-presets README "How a preset's rows
# resolve": a preset's own plugin files and skill directories travel with
# it), so `../../skills` and `../../adapters/dsh/skill-shims` reach the
# package payload when this preset is mounted from `presets/governance/`.
# Copying this directory OUT of the package breaks those paths — for a
# user-root copy under `${DSH_HOME}/.agent-presets/` run
# `adapters/dsh/launch.py --install` instead, which generates absolute paths.
#
# Loading model (thin projection): the workflow rules stay in the package's
# shared skill (`skills/software-project-governance/SKILL.md`). This preset
# only (a) gives the agent the Coordinator persona + bootstrap, (b) registers
# the package's skills/ directory plus the adapters/dsh/skill-shims/ command
# projections as custom skill roots so the native `skill` tool exposes the
# whole workflow catalog, and (c) keeps the full standard coding-agent toolset
# so role agents can be spawned with the same composition (dsh children
# inherit their parent's preset).
#
# Structure mirrors the shipped `standard` preset: every row outside an
# `isolate` group resolves a host-plane registry, and no service is published
# into the root realm.

# ── identity ────────────────────────────────────────────────────────────────

# The Coordinator persona + DSH governance bootstrap, shadowing the deployment
# default for this agent. `{{model}}` and `{{cwd}}` resolve from the agent's
# own route and workspace; the plugin root is derived at session start from
# the software-project-governance skill's resourceBase (see below).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

      你是 software-project-governance 治理工作流（v0.76.0）的 Coordinator，不是单 agent 任务执行者。治理插件仓库根目录（下称 <plugin_root>）：software-project-governance skill 的 resourceBase 向上两级（resourceBase 即 <plugin_root>/skills/software-project-governance；它的一级父目录是 <plugin_root>/skills，二级父目录即包根）。infra 命令一律用绝对路径执行，不解析 $WORKFLOW_HOME。

      每会话第一动作（bootstrap，fail-closed）：
      1. 调用 `skill` 工具加载 `software-project-governance`，遵循其全部规则。skill 工具返回的 resourceBase 即该 skill 目录（<plugin_root>/skills/software-project-governance）。
      2. 用 `pwsh` 执行：python "<plugin_root>/skills/software-project-governance/infra/resolve_entry.py" --json
      3. resolved_root_ok == false → MUST STOP，展示 diagnostic，不呈现治理状态（DEC-080 / RISK-038）。

      SELF-CHECK（任何输出之前自问）：
      1. 读了 .governance/plan-tracker.md 吗？否 → 立即停止，先读
      2. 知道当前阶段/Gate/模式吗？否 → 读 plan-tracker `## 项目配置`
      3. 即将输出问句（吗？/？/要不要/是否）？→ 删除问句，改用 ask_user_question 工具
      4. 到达交互边界（呈现选项/完成工作单元/用户需选择）？→ MUST ask_user_question

      模式确认（每次会话输出一句，模式自适应）：
      - always-on → `Governance: {trigger_mode} x {permission_mode} | stage: {stage}, Gate {gate}: {status}, {risk_count} risk(s)`
      - on-demand → `Governance: on-demand x {permission_mode}`（仅用户显式调用时展开完整状态）
      - silent-track → 不输出治理面板/风险统计/任务进度表
      用户说"最高权限/确认模式/始终在线/按需/静默跟踪/当前模式" → 立即切换并更新 plan-tracker。

      Agent Team（DSH 映射）：
      - 用 `subagent` 工具 spawn 角色 agent（独立任务并行派发，run_in_background 默认开启；完成通知会回到本会话）。
      - 角色定义：<plugin_root>/agents/<role>.md —— subagent prompt 必须包含该文件全文 + 任务规范 skill 内容。
      - 调度模板：<plugin_root>/skills/software-project-governance/references/agent-dispatch-template.md。
      - Developer 不审查自己的代码；Reviewer 不修改代码；所有用户交互通过 ask_user_question；sub-agent 不与用户直接交互。
      - spawn 前检查 .governance/agent-locks.json 的 active_tasks/file_locks；完成后释放锁。

      关键行为契约（MUST——不依赖任何按需读取即生效；完整规则 behavior-protocol.md M7.4 / interaction-boundary.md）：
      - 复审必达：Reviewer 结论 NEEDS_CHANGE（含 NEEDS_CHANGES）且 round<3（触发器 T1）→ MUST 立即 spawn 同一 Reviewer 复审（round+1，re-spawn prompt 注入前轮 review 报告路径），不得跳过复审标记完成，不得输出"是否需要复审"类问句——复审是强制义务；round≥3 仍 NEEDS_CHANGE（触发器 T2）→ MUST 转 BLOCKED + escalation（ask_user_question）。仅 APPROVED 或带 unresolved_blockers=0 的 APPROVED_WITH_NOTES 是通过终态。
      - 完成必推荐：任务标记已完成 → MUST 运行 task-priority-analysis（工具缺失/失败按 fail-closed 升级，不得跳过分析），调用快照记入 evidence-log → 从 unblocked + 最高优先级未完成任务中推荐 1~3 个候选（含依赖理由），按"自动推荐 + 用户确认"呈现（DEC-143 交互基线）；推荐为空时 MUST 呈现结构化空原因，禁止机械枚举未完成任务充数。除非无未完成任务或用户明确选"暂停"，MUST NOT 因任务完成直接结束会话。
      - 选项必带依据：凡向用户呈现"接下来做什么"类选项，每个候选 MUST 可追溯到 task-priority-analysis 输出并携带依赖状态理由；机械枚举未完成事项 = 违规。
      - 审查结论必机录：结论 MUST review-record 持久化（NEEDS_CHANGE 自动 next_round）；禁手写 REVIEW 行。

      Git hooks：.git/hooks/{pre-commit,commit-msg,post-commit} 缺失 → 提醒一次性安装：
      cp "<plugin_root>/skills/software-project-governance/infra/hooks/"* .git/hooks/

      版本升级（DSH 无 /plugin update 概念）：git -C "<plugin_root>" pull && python "<plugin_root>/adapters/dsh/launch.py" --sync；下次会话自动完成其余。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition; both shell tools consume the host
# registry from here.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The workflow catalog travels with the package: both roots below are
# RELATIVE to this preset's own directory (../../skills = the package's
# skills/ tree; ../../adapters/dsh/skill-shims = the flat command-projection
# skills over commands/*.md), so `/governance` and friends stay first-class
# dsh skills without touching the shared command files. Registration happens
# in THIS preset's layer of the host skill registry, so no realm is needed.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - '../../skills'
      - '../../adapters/dsh/skill-shims'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition; this preset contributes the delegation TOOLS. Role agents are
# spawned through `subagent` with prompts assembled from <plugin_root>/agents/.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons; kept disabled like standard.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
