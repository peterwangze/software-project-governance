# software-project-governance — dsh bundle composition layer.
#
# Declared by package.json `dsh.bundle.patch`; `dsh plugin --profile <name> add`
# appends this package to the profile's `dsh.profile.bundles` list because of
# that declaration (installed dsh: lib/plugin-9h8shc4d.js `exportsPatch` /
# `reconcilePlugins`), and the layer applies at profile boot (restart to take
# effect — bundle layers are boot-time, not HMR).
#
# Patch semantics: a non-insert patch REPLACES the targeted row's whole
# `config` (installed dsh: dsh-app-boot/lib/index.js `applyEntryPatches`;
# official publish tutorial "The loading order"), so every row below restates
# the complete config it needs.
#
# This bundle ships pure markdown/yaml payload — no Cordis entry, no
# install-time code execution (no prepare/build scripts). It contributes two
# UPDATE rows and no INSERT rows: an `- insert:` of `agent-presets` would
# duplicate the row dsh-web-app already inserts on web profiles and fail the
# boot with "duplicate loader entry id" (empirically verified against dsh
# 0.1.1-rc.2), while UPDATE rows on a tree without the target row only warn
# and skip (harmless on base-only profiles that carry no roster).

# ── agent-presets: roster wiring (declared; activation is dsh-version dependent) ──
#
# Restates the dsh-web-app baseline (cordis.patch.yml L441-445: `default:
# standard`; `includeUserRoot` defaults true and is restated explicitly) and
# declares one additional root pointing at the governance preset shipped in
# this package (`presets/governance/`).
#
# Path semantics (why `!!js`): `roots[].path` resolves via Node
# `path.resolve(expandHomePath(root.path))` — a relative value would resolve
# against the dsh process cwd, not this package (installed dsh:
# dsh-agent-presets/lib/index.js `scanRoot`; leading `~` expands, everything
# else is cwd/absolute). No static spelling reaches the pnpm-managed profile
# store (`$DSH_HOME/profiles/<profile>/node_modules/<pkg>`), so the path is
# computed at row activation by a synchronous `!!js` expression evaluated in
# the row's context (loader: `with (ctx) { eval(expr) }`), where `process`
# and the root-provided `dshHomePath` service are reachable — the same
# pattern dsh-base itself uses for `!!js dshHomePath('sessions')`.
#
# dsh boundary history: 0.1.1-rc.2 (verified in source, lib/profile-boot-
# DG5t9aNs.js `composeProfile`) appended a final overlay that replaced
# `agent-presets` `roots` with the shipped preset root alone — a bundle-
# declared root was visible in `dsh --profile <p> --dump-config` but not
# honored at boot, so the preset activated only through the user root that
# `adapters/dsh/launch.py --install` writes. **0.1.2-rc.1 (re-verified
# 2026-09-05, lib/profile-boot-BTzzdrGY.js `composeProfile`) applies bundle
# patches with no roots-forcing overlay**, and `dsh-agent-presets` scans
# `config.roots` in precedence order (`lib/index.js` `get roots()`), so this
# root is live at boot: a plain `dsh plugin add` + restart now exposes the
# shipped `governance` preset with no launcher script. `launch.py --install`
# remains as the optional user-root path (GUI-manageable copy / older-dsh
# fallback / preset-only installs without the bundle).
#
# `trust: system` (set 2026-09-05): the shipped preset belongs to the
# deployment, not the user. `deleteComposition` refuses presets whose trust is
# not `user` ("it ships with the deployment"), and `writableRoot()` returns
# the FIRST user-trust root — with `trust: user` here that would be this
# package's own presets dir (a pnpm junction straight into the source repo
# under `link:` installs), so a GUI delete would have `rm -rf`'d repository
# files through the junction. `trust: system` keeps the package preset
# read-only (copy-to-customize lands in `$DSH_HOME/.agent-presets`, delete
# refused, removal happens via `dsh plugin remove` — symmetric with install).
# `default` stays `standard` deliberately: the user picks `governance` per
# session (or sets the default in settings → agent presets).
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: standard
    includeUserRoot: true
    roots:
      - path: !!js >-
          (() => {
            const path = process.getBuiltinModule('node:path');
            const fs = process.getBuiltinModule('node:fs');
            const pkg = '@peterwangze/software-project-governance-plugin';
            let profile;
            for (let i = 2; i < process.argv.length; i++) {
              const arg = process.argv[i];
              if (arg === '--profile') { profile = process.argv[i + 1]; break; }
              if (arg.startsWith('--profile=')) { profile = arg.slice(10); break; }
              if (i === 2 && (arg === 'web' || arg === 'headless')) { profile = arg; break; }
            }
            const profilesRoot = dshHomePath('profiles');
            const names = [];
            if (profile) names.push(profile);
            try {
              for (const name of fs.readdirSync(profilesRoot)) {
                if (name !== 'node_modules' && !names.includes(name)) names.push(name);
              }
            } catch {}
            for (const name of names) {
              const root = path.join(profilesRoot, name, 'node_modules', pkg);
              if (fs.existsSync(path.join(root, 'cordis.patch.yml'))) {
                return path.join(root, 'presets');
              }
            }
            return path.join(profilesRoot, 'node_modules', pkg, 'presets');
          })()
        trust: system

# ── skill-filesystem: the governance skill catalog (boot-active mechanism) ──
#
# dsh-base inserts the host-plane `skill-filesystem` row with default roots;
# this layer replaces its config to add the two governance skill roots inside
# the installed package. `customSkillDirs` entries are resolved with Node
# `path.resolve` against the process cwd (installed dsh:
# dsh-skill-filesystem/lib/index.js), so the same self-locating `!!js`
# expression supplies absolute paths. The provider scans each root one level
# deep — `skills/<name>/SKILL.md` directory bundles (the 26 workflow skills)
# and flat `<name>.md` files (the 9 command projections in
# adapters/dsh/skill-shims/) are both first-class skill formats — and the
# merged catalog reaches every session of the profile regardless of agent
# preset (the preset plane merges the host-plane registry; dsh-agent-presets
# shipped `standard` composition, skill-filesystem row comment).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs: !!js >-
      (() => {
        const path = process.getBuiltinModule('node:path');
        const fs = process.getBuiltinModule('node:fs');
        const pkg = '@peterwangze/software-project-governance-plugin';
        let profile;
        for (let i = 2; i < process.argv.length; i++) {
          const arg = process.argv[i];
          if (arg === '--profile') { profile = process.argv[i + 1]; break; }
          if (arg.startsWith('--profile=')) { profile = arg.slice(10); break; }
          if (i === 2 && (arg === 'web' || arg === 'headless')) { profile = arg; break; }
        }
        const profilesRoot = dshHomePath('profiles');
        const names = [];
        if (profile) names.push(profile);
        try {
          for (const name of fs.readdirSync(profilesRoot)) {
            if (name !== 'node_modules' && !names.includes(name)) names.push(name);
          }
        } catch {}
        for (const name of names) {
          const root = path.join(profilesRoot, name, 'node_modules', pkg);
          if (fs.existsSync(path.join(root, 'cordis.patch.yml'))) {
            return [path.join(root, 'skills'), path.join(root, 'adapters', 'dsh', 'skill-shims')];
          }
        }
        return [];
      })()
