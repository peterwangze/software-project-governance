name: Governance CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify workflow integrity
        run: python skills/software-project-governance/infra/verify_workflow.py
      - name: Verify manifest consistency
        run: python skills/software-project-governance/infra/verify_workflow.py check-manifest-consistency --fail-on-issues
      - name: Run unit tests
        run: |
          python -m unittest discover -s skills/software-project-governance/infra/tests -v > unit-tests.log 2>&1; echo "UNITTEST_EXIT=$?" >> unit-tests.log; tail -n 120 unit-tests.log
      - name: Upload unit-test log (CI diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-log
          path: unit-tests.log
      - name: Verify cross-references
        run: python skills/software-project-governance/infra/verify_workflow.py check-cross-references
