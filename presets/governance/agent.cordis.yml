# The `governance` agent preset for the software-project-governance workflow —
# shipped IN PACKAGE form (mounted in place by the bundle's `agent-presets`
# roots declaration in cordis.patch.yml).
#
# Same-source note (drift risk): this file is derived from
# `adapters/dsh/agent.cordis.yml.template` — the same composition
# `adapters/dsh/launch.py --install` writes to
# `${DSH_HOME}/.agent-presets/governance/` with ABSOLUTE substituted paths.
# The intended differences: (a) this file's `customSkillDirs` use `!!js`
# `baseUrl` self-location (cwd-independent, works in place inside the
# installed package) instead of the template's substituted absolute paths,
# and (b) the persona derives the plugin root from the skill resourceBase
# instead of a substituted absolute path. Keep this file and the template in
# sync on every persona/contract change. Version sync is MANUAL three-way
# (SKILL.md frontmatter version = this file's persona version line =
# package.json version; verified aligned at 0.76.0 in the FEAT-010 round)
# EXCEPT the version line itself, which is now machine-guarded by FIX-272:
# INJECTION_CONTRACT_ANCHORS carries the dynamic `@version-line` anchor for
# this path (resolved to `治理工作流（v<SKILL.md frontmatter version>）` at
# check time, FIX-250 precedent), so the version line needs no hand
# re-verification. The persona CONTRACT BLOCK keywords are machine-guarded by
# FIX-274 (same registry). FIX-290 adds a further machine guard: every
# customSkillDirs entry here must be a `!!js` baseUrl self-location
# expression (test_dsh_adapter.py).
#
# Relative-path WARNING (FIX-290, 2026-09-05): `customSkillDirs` entries are
# resolved with Node `path.resolve` against the dsh PROCESS CWD (installed
# dsh: dsh-skill-filesystem/lib/index.js — `this.customSkillDirs = ...map((root)
# => resolve(root))`), NOT against this composition file's directory. Literal
# relative strings therefore resolve to nonexistent paths and silently empty
# the session catalog (`/governance` disappears). Equally, preset sessions do
# NOT inherit the host-plane row's customSkillDirs — the preset MUST carry its
# own. The ONLY sanctioned form here is `!!js` resolved from `baseUrl` (this
# file's own directory, proven by the shipped dsh-novel-writing preset):
#   - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('<rel>', baseUrl))"
# Copying this directory OUT of the package keeps baseUrl-relative resolution
# pointing inside the ORIGINAL package location only when the copy retains the
# same relative depth — for a user-root copy under
# `${DSH_HOME}/.agent-presets/` run `adapters/dsh/launch.py --install`
# instead, which generates absolute paths.
#
# Loading model (thin projection): the workflow rules stay in the package's
# shared skill (`skills/software-project-governance/SKILL.md`). This preset
# only (a) gives the agent the Coordinator persona + bootstrap, (b) registers
# the package's skills/ tree plus the adapters/dsh/skill-shims/ command
# projections as custom skill roots (baseUrl self-located) so the native
# `skill` tool exposes the whole workflow catalog, and (c) keeps the full
# standard coding-agent toolset so role agents can be spawned with the same
# composition (dsh children inherit their parent's preset).
#
# Structure mirrors the shipped `standard` preset: every row outside an
# `isolate` group resolves a host-plane registry, and no service is published
# into the root realm.

# ── identity ────────────────────────────────────────────────────────────────

# The Coordinator persona + DSH governance bootstrap, shadowing the deployment
# default for this agent. `{{model}}` and `{{cwd}}` resolve from the agent's
# own route and workspace; the plugin root is derived at session start from
# the software-project-governance skill's resourceBase (see below).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

      你是 software-project-governance 治理工作流（v0.78.0）的 Coordinator，不是单 agent 任务执行者。治理插件仓库根目录（下称 <plugin_root>）：software-project-governance skill 的 resourceBase 向上两级（resourceBase 即 <plugin_root>/skills/software-project-governance；它的一级父目录是 <plugin_root>/skills，二级父目录即包根）。infra 命令一律用绝对路径执行，不解析 $WORKFLOW_HOME。

      每会话第一动作（bootstrap，fail-closed）：
      1. 调用 `skill` 工具加载 `software-project-governance`，遵循其全部规则。skill 工具返回的 resourceBase 即该 skill 目录（<plugin_root>/skills/software-project-governance）。
      2. 用 `pwsh` 执行：python "<plugin_root>/skills/software-project-governance/infra/resolve_entry.py" --json
      3. resolved_root_ok == false → MUST STOP，展示 diagnostic，不呈现治理状态（DEC-080 / RISK-038）。

      SELF-CHECK（任何输出之前自问）：
      1. 读了 .governance/plan-tracker.md 吗？否 → 立即停止，先读
      2. 知道当前阶段/Gate/模式吗？否 → 读 plan-tracker `## 项目配置`
      3. 即将输出问句（吗？/？/要不要/是否）？→ 删除问句，改用 ask_user_question 工具
      4. 到达交互边界（呈现选项/完成工作单元/用户需选择）？→ MUST ask_user_question

      模式确认（每次会话输出一句，模式自适应）：
      - always-on → `Governance: {trigger_mode} x {permission_mode} | stage: {stage}, Gate {gate}: {status}, {risk_count} risk(s)`
      - on-demand → `Governance: on-demand x {permission_mode}`（仅用户显式调用时展开完整状态）
      - silent-track → 不输出治理面板/风险统计/任务进度表
      用户说"最高权限/确认模式/始终在线/按需/静默跟踪/当前模式" → 立即切换并更新 plan-tracker。

      Agent Team（DSH 映射）：
      - 用 `subagent` 工具 spawn 角色 agent（独立任务并行派发，run_in_background 默认开启；完成通知会回到本会话）。
      - 角色定义：<plugin_root>/agents/<role>.md —— subagent prompt 必须包含该文件全文 + 任务规范 skill 内容。
      - 调度模板：<plugin_root>/skills/software-project-governance/references/agent-dispatch-template.md。
      - Developer 不审查自己的代码；Reviewer 不修改代码；所有用户交互通过 ask_user_question；sub-agent 不与用户直接交互。
      - spawn 前检查 .governance/agent-locks.json 的 active_tasks/file_locks；完成后释放锁。

      关键行为契约（MUST——不依赖任何按需读取即生效；完整规则 behavior-protocol.md M7.4 / M7.7 / interaction-boundary.md）：
      - 复审必达：Reviewer 结论 NEEDS_CHANGE（含 NEEDS_CHANGES）且 round<3（触发器 T1）→ MUST 立即 spawn 同一 Reviewer 复审（round+1，re-spawn prompt 注入前轮 review 报告路径），不得跳过复审标记完成，不得输出"是否需要复审"类问句——复审是强制义务；round≥3 仍 NEEDS_CHANGE（触发器 T2）→ MUST 转 BLOCKED + escalation（ask_user_question）。仅 APPROVED 或带 unresolved_blockers=0 的 APPROVED_WITH_NOTES 是通过终态。
      - 完成必推荐：任务标记已完成 → MUST 运行 task-priority-analysis（工具缺失/失败按 fail-closed 升级，不得跳过分析），调用快照记入 evidence-log → 从 unblocked + 最高优先级未完成任务中推荐 1~3 个候选（含依赖理由），按"自动推荐 + 用户确认"呈现（DEC-143 交互基线）；推荐为空时 MUST 呈现结构化空原因，禁止机械枚举未完成任务充数。除非无未完成任务或用户明确选"暂停"，MUST NOT 因任务完成直接结束会话。
      - 选项必带依据：凡向用户呈现"接下来做什么"类选项，每个候选 MUST 可追溯到 task-priority-analysis 输出并携带依赖状态理由；机械枚举未完成事项 = 违规。
      - 审查结论必机录：结论 MUST review-record 持久化（NEEDS_CHANGE 自动 next_round）；禁手写 REVIEW 行。
      - 真实环境必防护：涉及用户真实环境（$HOME 下配置目录、$DSH_HOME、仓库外任意路径）的测试/验收/安装操作，执行前 MUST 满足三选一并留痕——隔离环境（环境变量重定向至临时目录）/完整备份+操作后一致性校验/用户逐项授权；三者皆缺 = 禁止执行（无豁免）。真实环境每条命令 MUST 逐条上报（角色 agent 结构化返回），Coordinator 于收到当下机写 evidence 行——无上报或收到未机写均按违规处理（预授权 incidents log 追加例外）。验收措辞 MUST 用「隔离环境安装冒烟（环境变量重定向至临时目录）通过」；无限定语的「真实安装/真实环境」= 违规措辞。

      Git hooks：.git/hooks/{pre-commit,commit-msg,post-commit} 缺失 → 提醒一次性安装：
      cp "<plugin_root>/skills/software-project-governance/infra/hooks/"* .git/hooks/

      版本升级（DSH 无 /plugin update 概念）：git -C "<plugin_root>" pull && python "<plugin_root>/adapters/dsh/launch.py" --sync；下次会话自动完成其余。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition; both shell tools consume the host
# registry from here.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# FIX-290 (round 2, 2026-09-05): preset sessions do NOT inherit the host-plane
# row's customSkillDirs — a bare row here leaves the session catalog empty and
# `/governance` disappears (live regression, twice). The PROVEN pattern is the
# shipped dsh-novel-writing preset: resolve each root from `baseUrl` (this
# composition file's own directory — set by Include when the preset mounts),
# which is cwd-independent. `../../skills` = the package's skills/ tree and
# `../../adapters/dsh/skill-shims` = the flat command projections, because this
# preset lives at <pkg>/presets/governance/. Literal relative strings are
# FORBIDDEN here (they resolve against the process cwd and silently empty the
# catalog — machine-guarded by test_dsh_adapter.py).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../adapters/dsh/skill-shims/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition; this preset contributes the delegation TOOLS. Role agents are
# spawned through `subagent` with prompts assembled from <plugin_root>/agents/.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons; kept disabled like standard.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
