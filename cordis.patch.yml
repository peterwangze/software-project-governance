# software-project-governance — dsh bundle composition layer (patch).
#
# Declared by package.json `dsh.bundle.patch`; `dsh plugin --profile <name> add`
# appends this package to the profile's `dsh.profile.bundles` list because of
# that declaration, and the layer applies at profile boot (a restart is needed
# — bundle layers are boot-time, not HMR).
#
# ── The whole layer is ONE insert row naming this package only ──────────────
#
# DEC-187 architecture invariant I-1/I-2/I-3 (user ruling, 2026-09-12): no
# intrusive modification of host behaviour, no host→plugin reverse dependency,
# forward dependency only. This layer therefore contains:
#
#   * ZERO `- id: <host row>` UPDATE rows — every dsh / dsh-web-app / other
#     vendor row keeps its config and `disabled` exactly as the deployment
#     composed it (`dsh --profile web --dump-config` before/after an install
#     differs by one inserted row and nothing else);
#   * ZERO `!!js` expressions — in particular none that parse `process.argv`
#     or scan `$DSH_HOME/profiles` to self-locate (that was the FIX-307/FIX-309
#     host-plane registration face, removed with the rest of the intrusion);
#   * ZERO `trust: system` preset-root declarations — the governance preset is
#     delivered into the USER preset root by the inserted row, which is what
#     makes it a custom (deletable, openable) preset in the settings page;
#   * ZERO service / provider / tool registration in the host plane — the row
#     module (`lib/index.js`) publishes no service and registers nothing; its
#     only effect is rendering the package's preset payload
#     (`agent-presets/governance/agent.cordis.yml.template` + `preset.yml`)
#     into `$DSH_HOME/.agent-presets/governance/` (see the module header).
#
# Patch semantics (upstream `dsh-app-boot/lib/index.js` `applyEntryPatches`):
# `insert` with no `id` appends to the root entry list; an `- id:`-targeted
# entry REPLACES the targeted row's whole `config`. This layer uses only the
# first form, so no pre-existing row is reachable from it.
#
# The dsh build this semantic was read from is NOT named here: a version
# literal in a comment cannot be kept true (it silently goes stale on every
# upstream release — this line previously named a release-candidate that the
# installed tree had already moved past). The verified host version of record
# lives in `adapters/dsh/host-contract.json` -> `evidence.dsh_cli_version`,
# which the contract's boundary check enforces against the live plane.
#
# Why an insert at all, and not `launch.py` alone: the insert is how `dsh
# plugin add` + restart registers the preset with zero user action, while
# `adapters/dsh/launch.py --install` stays available as the manual / offline
# path (mirroring the reference bundle's `install.ps1` / `install.sh`). Both
# render the same single composition source to the same place, with the same
# three-token substitution, so they cannot disagree.
- insert:
    - id: governance
      name: '@peterwangze/software-project-governance-plugin'
